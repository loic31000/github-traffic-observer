name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile scripts/archive_traffic.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Ensure no real archive directory is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files 'traffic/**' '.traffic-raw/**' 'raw/**' | grep -q .; then
            echo "Real traffic/raw data must not be tracked in the public repository."
            exit 1
          fi
